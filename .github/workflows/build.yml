name: Build & Test SolidModelBrowser

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: |
        nuget restore SolidModelBrowser.sln
        msbuild SolidModelBrowser.sln /t:restore

    - name: Build Solution
      run: msbuild SolidModelBrowser.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Run Unit Tests
      run: dotnet test SolidModelBrowser.Tests/SolidModelBrowser.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolidModelBrowser-Release
        path: |
          SolidModelBrowser/bin/Release/*.exe
          SolidModelBrowser/bin/Release/*.dll
          SolidModelBrowser/bin/Release/*.config
